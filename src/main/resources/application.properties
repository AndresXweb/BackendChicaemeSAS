spring.application.name=BackendSistema
# ===============================
# CONFIGURACI�N DE POSTGRESQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/chicaemesas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACI�N DE HIBERNATE (JPA)
# ===============================
# update: Crea las tablas si no existen y las actualiza si agregas columnas
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola de IntelliJ el SQL que Spring genera por debajo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CORREO (recuperación de contraseña)
# ===============================
# Para pruebas con Gmail: activa verificación en 2 pasos en esa cuenta y genera
# una "contraseña de aplicación" en https://myaccount.google.com/apppasswords
# NO uses tu contraseña normal de Gmail acá.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=TU_CORREO@gmail.com
spring.mail.password=TU_CONTRASENA_DE_APLICACION
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend, para armar el enlace que va dentro del correo
app.frontend.url=http://localhost:5173