spring.application.name=BackendSistema
# ===============================
# CONFIGURACIÓN DE POSTGRESQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/chicaemesas
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACIÓN DE HIBERNATE (JPA)
# ===============================
# update: Crea las tablas si no existen y las actualiza si agregas columnas
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola de IntelliJ el SQL que Spring genera por debajo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect