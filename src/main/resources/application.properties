spring.application.name=BackendSistema

# ===============================
# INICIO MAS LIVIANO
# ===============================
spring.main.lazy-initialization=true

# ===============================
# PUERTO (Render inyecta PORT)
# ===============================
server.port=${PORT:8080}

# Menos hilos de Tomcat = menos memoria
server.tomcat.threads.max=20
server.tomcat.threads.min-spare=5

# ===============================
# BASE DE DATOS (PostgreSQL - Render)
# ===============================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===============================
# JPA / HIBERNATE
# ===============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ===============================
# CORREO
# ===============================
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend (para el enlace del correo de recuperación)
app.frontend.url=${FRONTEND_URL}

# URL pública del backend (para las URLs de las imágenes subidas)
app.backend.url=${BACKEND_URL}

# ===============================
# SUBIDA DE ARCHIVOS
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ===============================
# JWT
# ===============================
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# GOOGLE SIGN-IN
# ===============================
google.client.id=${GOOGLE_CLIENT_ID}