spring.application.name=BackendSistema
# ===============================
# CONFIGURACION DE MYSQL
# ===============================
spring.datasource.url=jdbc:mysql://localhost:3307/chicaemesas
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===============================
# CONFIGURACION DE HIBERNATE (JPA)
# ===============================
# update: Crea las tablas si no existen y las actualiza si agregas columnas
spring.jpa.hibernate.ddl-auto=update
# Muestra en la consola el SQL que Spring genera por debajo
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ===============================
# CORREO (recuperacion de contrasena)
# ===============================
# Para pruebas con Gmail: activa verificacion en 2 pasos en esa cuenta y genera
# una "contrasena de aplicacion" en https://myaccount.google.com/apppasswords
# NUNCA pongas el valor real aqui: se lee de una variable de entorno.
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_APP_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# URL del frontend, para armar el enlace que va dentro del correo
app.frontend.url=http://localhost:5173

# ===============================
# SUBIDA DE ARCHIVOS (fotos)
# ===============================
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
app.upload.dir=uploads

# ===============================
# JWT
# ===============================
# Sin valor por defecto a proposito: si falta la variable de entorno,
# la app debe fallar al arrancar en vez de firmar tokens con una clave conocida.
jwt.secret=${JWT_SECRET}
jwt.expiration=86400000

# ===============================
# GOOGLE SIGN-IN
# ===============================
# El mismo Client ID que se configura en el frontend (es publico, pero igual
# lo dejamos como variable de entorno para poder cambiarlo sin tocar codigo).
google.client.id=${GOOGLE_CLIENT_ID}
